services:
  db:
    image: postgres:16-alpine
    container_name: lesson5-todo-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lesson5_todos
    ports:
      - "5492:5432"
    volumes:
      - todo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lesson5_todos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  todo-db-data:
